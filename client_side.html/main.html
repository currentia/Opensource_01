<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 창 </title>
    <style>
        /* [디자인 정보]
           1. 로그인 버튼: 오른쪽 끝에서 약 3cm(110px) 왼쪽으로 이동
           2. 달력: 가로로 길게 확장된 형태 (900px) */
        
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            background-color: #f4f7f6;
            margin: 0;
        }

        .login-header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 0;
            position: absolute;
            top: 20px;
            padding-right: 110px; 
            z-index: 100;
        }

        .login-btn {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 80px;
            width: 900px; 
            max-width: 95%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            width: calc(100% / 7);
            height: 70px;
            text-align: right;
            vertical-align: top;
            padding: 8px;
            box-sizing: border-box;
        }

        th {
            background-color: #eee;
            height: 30px;
            text-align: center;
            vertical-align: middle;
        }

        td:hover:not(:empty) {
            background-color: #f0f0f0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-header">
        <button class="login-btn" onclick="goToLogin()">로그인 하기</button>
    </div>

    <div class="calendar-container">
        <h2 style="text-align: center; margin-top: 0;">5월</h2>
        <table>
            <thead>
                <tr>
                    <th style="color: red;">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th style="color: blue;">토</th>
                </tr>
            </thead>
            <tbody id="calendarBody">
                </tbody>
        </table>
    </div>

    <script>
        /**
         * [기능 설명]
         * 1. goToLogin: 알림창(alert) 없이 바로 login.html 페이지로 이동시킵니다.
         * 2. createCalendar: 2026년 5월 1일(금요일) 시작에 맞춰 달력을 생성합니다.
         */

        function goToLogin() {
            // 알림창 코드를 삭제하고, 페이지 이동 코드만 남겼습니다.
            window.location.href = 'login.html'; 
        }

        function createCalendar() {
            const tbody = document.getElementById('calendarBody');
            let date = 1;
            const startDay = 5; // 금요일 시작
            
            for (let i = 0; i < 6; i++) {
                let row = document.createElement('tr');
                for (let j = 0; j < 7; j++) {
                    let cell = document.createElement('td');
                    if (i === 0 && j < startDay) {
                        cell.innerText = "";
                    } else if (date > 31) {
                        cell.innerText = "";
                    } else {
                        cell.innerText = date;
                        date++;
                    }
                    row.appendChild(cell);
                }
                tbody.appendChild(row);
                if (date > 31) break; 
            }
        }

        createCalendar();
    </script>
</body>
</html>
