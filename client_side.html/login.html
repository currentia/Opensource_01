<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
    <style>
        /* [디자인 수정 사항 - AI 작성]
           1. margin-top을 조절하여 로그인 박스를 위로 약 2cm 올렸습니다.
           2. container의 너비를 넓혀 가로로 긴 디자인을 적용했습니다.
           3. 하단 버튼들을 한 줄에 배치하도록 스타일을 추가했습니다. */
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 40px 60px; /* 가로 패딩을 늘려 길게 만듦 */
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #333;
            /* [수정] 위로 2cm 정도 올리기 위해 margin-bottom 사용 */
            margin-bottom: 80px; 
            /* [수정] 가로로 길게 설정 */
            width: 500px; 
        }

        .login-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1; /* 입력창이 가로로 길게 늘어나도록 함 */
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .login-btn {
            padding: 28px 20px; /* 로그인 버튼 세로 길이 유지 */
            background-color: #f9f9f9;
            border: 1px solid #333;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap; /* 글자 줄바꿈 방지 */
        }

        /* 하단 버튼들 배치 */
        .sub-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
        }

        .sub-btn {
            padding: 8px 15px;
            background-color: white;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 13px;
        }

        .sub-btn:hover {
            background-color: #eee;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="input-group">
                <input type="text" id="userId" placeholder="아이디">
                <input type="password" id="userPw" placeholder="비밀번호">
            </div>
            <button class="login-btn" onclick="handleLogin()">로그인</button>
        </div>

        <div class="sub-buttons">
            <button class="sub-btn" onclick="goToSignup()">회원가입 하기</button>
            <button class="sub-btn" onclick="findAccount()">아이디 / 비밀번호 찾기</button>
        </div>
    </div>

    <script>
        /**
         * [자바스크립트 설명]
         * 1. handleLogin: 로그인 시도 알림.
         * 2. goToSignup: 회원가입 페이지 이동 알림.
         * 3. findAccount: 계정 찾기 페이지 이동 알림.
         */

        function handleLogin() {
            const id = document.getElementById('userId').value;
            alert(id + "님, 로그인을 시도합니다.");
        }

        function goToSignup() {
            alert("회원가입 하기 페이지로 이동합니다.");
        }

        function findAccount() {
            alert("아이디 또는 비밀번호 찾기 페이지로 이동합니다.");
        }
    </script>
</body>
</html>
