<html lang="ko">
<body>

<h1>로그인</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="user_id" placeholder="아이디">
    <input type="password" name="user_pw" placeholder="비밀번호">

    <button type="submit">로그인</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<a href="/register/">회원가입</a>

</body>
</html>
