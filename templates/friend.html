<html lang="ko">
<body>

<h1>친구 관리</h1>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="friend_id" placeholder="친구 아이디 입력">
    <button type="submit">친구 추가</button>
</form>

{% if message %}
<p>{{ message }}</p>
{% endif %}

<h3>친구 목록</h3>

{% for f in friends %}
    <p>{{ f.friend.user_id }}</p>
{% empty %}
    <p>친구가 없습니다.</p>
{% endfor %}

<br>
<a href="/main/">메인으로 돌아가기</a>

</body>
</html>
