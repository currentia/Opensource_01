{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — MoneyMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
</head>
<body>

<div class="container">

  <div class="header">
    <a href="{% url 'ledger:first' %}" class="logo">
      <i class="ti ti-wallet"></i>
      MoneyMate
    </a>
    <p class="subtitle">함께하는 소비 관리</p>
  </div>

  <div class="card">

    <p class="form-title">로그인</p>

    {% if form.non_field_errors %}
      <div class="server-error">
        {% for error in form.non_field_errors %}
          {{ error }}
        {% endfor %}
      </div>
    {% endif %}

    <form id="login-form" method="POST" action="{% url 'accounts:login' %}">
      {% csrf_token %}

      <!-- 아이디 -->
      <div class="field">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <i class="ti ti-user icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            value="{{ form.username.value|default:'' }}"
            autocomplete="username"
          >
        </div>
        <p class="error-msg" id="username-error"></p>
      </div>

      <!-- 비밀번호 -->
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <i class="ti ti-lock icon"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
          >
          <button type="button" class="toggle-pw" onclick="togglePassword()" aria-label="비밀번호 표시/숨김">
            <i class="ti ti-eye" id="eye-on"></i>
            <i class="ti ti-eye-off" id="eye-off" style="display:none;"></i>
          </button>
        </div>
        <p class="error-msg" id="password-error"></p>
      </div>

      <button type="submit" class="login-btn">
        <i class="ti ti-login"></i>
        로그인
      </button>

    </form>

    <div class="footer-links">
      <a href="#">아이디 찾기</a>
      <a href="#">비밀번호 찾기</a>
    </div>

    <div class="divider"></div>

    <p class="signup-row">
      아직 계정이 없으신가요?&nbsp;
      <a href="{% url 'accounts:signup' %}">회원가입</a>
    </p>

  </div>
</div>

<script src="{% static 'accounts/js/login.js' %}"></script>
</body>
</html>
