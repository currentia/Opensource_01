{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — MoneyMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="{% static 'accounts/css/signup.css' %}">
</head>
<body>

<div class="container">

  <div class="header">
    <a href="{% url 'ledger:first' %}" class="logo">
      <i class="ti ti-wallet"></i>
      MoneyMate
    </a>
    <p class="subtitle">함께하는 소비 관리</p>
  </div>

  <div class="card">

    <p class="form-title">회원가입</p>

    <!-- 서버 에러 -->
    {% if errors %}
      <div class="server-error">
        {% for error in errors %}
          <p>{{ error }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form id="signup-form" method="POST" action="{% url 'accounts:signup' %}">
      {% csrf_token %}

      <!-- ── 계정 정보 ── -->
      <p class="section-label">계정 정보</p>

      <!-- 아이디 -->
      <div class="field">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <i class="ti ti-user icon"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요 (4자 이상)"
            value="{{ form_data.username|default:'' }}"
            autocomplete="username"
          >
        </div>
        <p class="error-msg" id="username-error"></p>
      </div>

      <!-- 비밀번호 -->
      <div class="field">
        <label for="password1">비밀번호</label>
        <div class="input-wrap">
          <i class="ti ti-lock icon"></i>
          <input
            type="password"
            id="password1"
            name="password1"
            placeholder="비밀번호를 입력하세요 (8자 이상)"
            autocomplete="new-password"
          >
          <button type="button" class="toggle-pw"
            onclick="togglePassword('password1','eye-on-1','eye-off-1')"
            aria-label="비밀번호 표시/숨김">
            <i class="ti ti-eye"     id="eye-on-1"></i>
            <i class="ti ti-eye-off" id="eye-off-1" style="display:none;"></i>
          </button>
        </div>
        <p class="error-msg" id="password1-error"></p>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="field">
        <label for="password2">비밀번호 확인</label>
        <div class="input-wrap">
          <i class="ti ti-lock-check icon"></i>
          <input
            type="password"
            id="password2"
            name="password2"
            placeholder="비밀번호를 다시 입력하세요"
            autocomplete="new-password"
          >
          <button type="button" class="toggle-pw"
            onclick="togglePassword('password2','eye-on-2','eye-off-2')"
            aria-label="비밀번호 확인 표시/숨김">
            <i class="ti ti-eye"     id="eye-on-2"></i>
            <i class="ti ti-eye-off" id="eye-off-2" style="display:none;"></i>
          </button>
        </div>
        <p class="error-msg" id="password2-error"></p>
      </div>

      <div class="section-divider"></div>

      <!-- ── 개인 정보 ── -->
      <p class="section-label">개인 정보</p>

      <!-- 이름 -->
      <div class="field">
        <label for="name">이름</label>
        <div class="input-wrap">
          <i class="ti ti-id-badge icon"></i>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="실명을 입력하세요"
            value="{{ form_data.name|default:'' }}"
          >
        </div>
        <p class="error-msg" id="name-error"></p>
      </div>

      <!-- 생년월일 -->
      <div class="field">
        <label for="birth">생년월일</label>
        <div class="input-wrap">
          <i class="ti ti-calendar icon"></i>
          <input
            type="date"
            id="birth"
            name="birth"
            value="{{ form_data.birth|default:'' }}"
          >
        </div>
        <p class="error-msg" id="birth-error"></p>
      </div>

      <div class="section-divider"></div>

      <!-- ── 소비 목표 ── -->
      <p class="section-label">소비 목표</p>

      <!-- 일 목표 금액 -->
      <div class="field">
        <label for="daily_budget">하루 목표 금액</label>
        <div class="input-wrap">
          <i class="ti ti-currency-won icon"></i>
          <input
            type="number"
            id="daily_budget"
            name="daily_budget"
            placeholder="하루 목표 금액을 입력하세요"
            min="0"
            value="{{ form_data.daily_budget|default:'' }}"
          >
        </div>
        <p class="hint-msg">월 1회만 수정 가능합니다.</p>
        <p class="error-msg" id="daily_budget-error"></p>
      </div>

      <!-- 회원가입 버튼 -->
      <button type="submit" class="signup-btn">
        <i class="ti ti-user-plus"></i>
        회원가입
      </button>

    </form>

  </div>

  <p class="login-row">
    이미 계정이 있으신가요?&nbsp;
    <a href="{% url 'accounts:login' %}">로그인</a>
  </p>

</div>

<script src="{% static 'accounts/js/signup.js' %}"></script>
</body>
</html>
