<html lang="ko">
<body>

<h1>회원가입</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="user_id" placeholder="아이디">
    <input type="password" name="user_pw" placeholder="비밀번호">

    <button type="submit">회원가입</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;">{{ success }}</p>
{% endif %}

<a href="/">로그인으로 돌아가기</a>

</body>
</html>
